# CI for agda-graph-explorer.
#
# Unlike the agda-deps repo, NOTHING here links Agda — every tool is a
# pure consumer of agda-deps' v2 graph.json. So there is no
# source-repository-package pin, no Agda-from-source build, and no
# git-submodule dance: a clean `cabal build` resolves entirely from
# Hackage and finishes in minutes.
#
# Smoke + acceptance over the committed expanded-JSON fixtures
# (test/deps.json, .agda-explore/deps.json) — no agda-deps / Agda binary
# is needed in CI. The agda-goals live drive (which shells out to
# `agda`) and agda-explore's live graph regeneration (which shells out
# to `agda-deps`) are intentionally NOT exercised here.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Set up Haskell (GHC 9.14.1 + cabal 3.16)
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.16'

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          ~/.cabal/packages
          dist-newstyle
        key: ${{ runner.os }}-ghc9.14.1-${{ hashFiles('cabal.project', 'agda-graph-explorer.cabal') }}
        restore-keys: |
          ${{ runner.os }}-ghc9.14.1-

    - name: Canary fixture guard (files only ci-live reads)
      # Fixtures referenced only by the non-blocking weekly ci-live canary (or
      # silently skipped by it, like regen.sh behind an `if [ -f ]`) fail no
      # PR gate when a `git add` is forgotten — that exact miss has shipped
      # once. Assert they are tracked, and syntax-check the smoke script.
      run: |
        for f in test/auto/smoke.sh \
                 test/interaction/regen.sh \
                 test/interaction/src/Combine.agda \
                 test/interaction/src/HoleHint.agda \
                 test/interaction/src/Unsolved.agda \
                 test/interaction/src/Stuck.agda \
                 test/interaction/src/HoleBlocked.agda; do
          git ls-files --error-unmatch "$f" >/dev/null \
            || { echo "canary fixture untracked/missing: $f"; exit 1; }
        done
        bash -n test/auto/smoke.sh
        echo "canary fixture guard OK"

    - name: Fixture version pin (ci-live's agda == the committed goldens)
      # regen.sh writes into $(agda --version)/, and ci-live regenerates the
      # goldens against the version it pins and fails on ANY diff. So goldens
      # captured from a different agda than the pin surface there as "PROTOCOL
      # DRIFT" — untracked files in a second version directory — when the real
      # fault is version skew. That misreads for weeks on a non-blocking weekly
      # canary, so catch it here, on the PR gate, without needing agda.
      run: |
        pin=$(grep -oE 'Agda-[0-9]+(\.[0-9]+)+' .github/workflows/ci-live.yml | head -1 | sed 's/Agda-//')
        dir=$(grep -oE 'test/interaction/[0-9]+(\.[0-9]+)+/' test/Spec.hs | head -1 | sed 's#test/interaction/##; s#/##')
        have=$(git ls-files 'test/interaction/*' \
                 | grep -oE '^test/interaction/[0-9]+(\.[0-9]+)+' \
                 | sed 's#test/interaction/##' | sort -u)
        [ -n "$pin" ] && [ -n "$dir" ] || { echo "could not read the agda pin / fixtureDir"; exit 1; }
        [ "$pin" = "$dir" ] \
          || { echo "version skew: ci-live pins Agda-$pin but test/Spec.hs replays $dir"; exit 1; }
        [ "$have" = "$pin" ] \
          || { echo "committed fixture dirs are [$(echo $have)], expected exactly $pin"; exit 1; }
        echo "fixture version pin OK (Agda $pin)"

    - name: Golden transcripts carry no absolute paths
      # IOTCM needs an absolute file argument and agda echoes it back inside
      # error messages and highlighting notes, so a naive capture bakes the
      # generating machine's checkout path into the goldens — which then differ
      # on every other checkout and fail ci-live's verbatim drift check forever.
      # regen.sh normalizes them out; assert it stayed that way.
      run: |
        if git grep -lIE '(/home/|/Users/|[A-Za-z]:\\\\)' -- 'test/interaction/*/*'; then
          echo "golden transcript carries an absolute path — regen.sh must normalize it out"
          exit 1
        fi
        echo "no absolute paths in the goldens"

    - name: Update Hackage index
      run: cabal update

    - name: Dependency drift check
      run: cabal build --dry-run

    - name: Build all targets (library + 5 executables)
      run: cabal build

    - name: agda-optimization — smoke over the fixture
      run: |
        cabal run -v0 agda-optimization -- motif        test/deps.json
        cabal run -v0 agda-optimization -- load-bearing test/deps.json
        cabal run -v0 agda-optimization -- basket       test/deps.json

    - name: agda-optimization — determinism (-N1 == -N4, human + JSON)
      # Byte-identical output between +RTS -N1 and +RTS -N4 is the
      # acceptance invariant for the multicore sibling binaries.
      run: |
        for sub in motif basket fingerprint term-cluster; do
          cabal run -v0 agda-optimization -- "$sub" test/deps.json +RTS -N1 -RTS > "/tmp/$sub.n1"
          cabal run -v0 agda-optimization -- "$sub" test/deps.json +RTS -N4 -RTS > "/tmp/$sub.n4"
          diff "/tmp/$sub.n1" "/tmp/$sub.n4" || { echo "NON-DETERMINISTIC: $sub"; exit 1; }
          cabal run -v0 agda-optimization -- "$sub" test/deps.json --json +RTS -N1 -RTS > "/tmp/$sub.j1"
          cabal run -v0 agda-optimization -- "$sub" test/deps.json --json +RTS -N4 -RTS > "/tmp/$sub.j4"
          diff "/tmp/$sub.j1" "/tmp/$sub.j4" || { echo "NON-DETERMINISTIC (json): $sub"; exit 1; }
        done
        echo "determinism OK"

    - name: agda-unused — finding smoke (path-rebased fixture)
      # test/unused/ ships toy sources + deps.json.in with a @ROOT@ placeholder;
      # rebasing it to the checkout path yields a graph whose moduleFiles match
      # the sources, so agda-unused reports its known duplicate-using finding.
      # Deterministic, no agda needed (agda-unused is a pure JSON consumer), and
      # exercises the canonical --graph flag.
      run: |
        root="$(pwd)/test/unused"
        sed "s|@ROOT@|$root|g" test/unused/deps.json.in > /tmp/unused-deps.json
        out="$(cabal run -v0 agda-unused -- --graph=/tmp/unused-deps.json --count-only "$root")"
        echo "$out"
        echo "$out" | grep -q "# total: 1 finding" \
          || { echo "expected exactly 1 finding from the fixture"; exit 1; }
        # A ROOT naming ONE FILE must find what the directory scan finds. It
        # used to scan nothing and report a silent `# total: 0` for every kind
        # — the shape `agda-explore`'s `unused scope=FILE` (and the plugin's
        # post-edit hook, which scopes to the file just edited) asks for.
        one="$(cabal run -v0 agda-unused -- --graph=/tmp/unused-deps.json --count-only "$root/Main.agda")"
        echo "$one"
        echo "$one" | grep -q "# total: 1 finding" \
          || { echo "single-file ROOT scanned nothing"; exit 1; }
        echo "agda-unused finding smoke OK"

    - name: agda-explore — binary smoke
      run: cabal run -v0 agda-explore -- --version

    - name: Plugin hooks — syntax check
      # The hooks run in the user's Claude Code session, never in a test, so a
      # syntax error surfaces only as silence (they are written to degrade
      # quietly on any failure). `bash -n` is the one guard that can see it.
      run: |
        for h in plugin/hooks/*.sh plugin/bin/*.sh; do
          bash -n "$h" || { echo "syntax error in $h"; exit 1; }
        done
        echo "plugin hook syntax OK"

    - name: Version sync (cabal == plugin.json == every --numeric-version)
      # One version source (AgdaGraph.Version off Paths): all five binaries and
      # the plugin manifest must report the same version as the .cabal field.
      run: |
        cabal_v=$(grep -E '^version:' agda-graph-explorer.cabal | awk '{print $2}')
        plugin_v=$(jq -r .version plugin/.claude-plugin/plugin.json)
        echo "cabal=$cabal_v plugin=$plugin_v"
        [ "$cabal_v" = "$plugin_v" ] \
          || { echo "plugin.json version ($plugin_v) != cabal ($cabal_v)"; exit 1; }
        for e in agda-unused agda-goals agda-optimization agda-explore agda-auto; do
          v=$(cabal run -v0 "$e" -- --numeric-version)
          [ "$v" = "$cabal_v" ] \
            || { echo "$e --numeric-version ($v) != cabal ($cabal_v)"; exit 1; }
        done
        echo "version sync OK"

    - name: agda-auto / agda-goals — offline CLI smoke
      # These two need `agda` to do real work (skipped in CI), but their pure
      # CLI paths (help / version / show-defaults) must stay green.
      run: |
        for f in --help --version --numeric-version --show-defaults; do
          cabal run -v0 agda-auto  -- "$f" >/dev/null
          cabal run -v0 agda-goals -- "$f" >/dev/null
        done
        echo "auto/goals CLI smoke OK"

    - name: README quickstart runs (doc-rot guard)
      # The exact "Try it in 30 seconds" block from README.md, over the fixture.
      run: |
        cabal run -v0 agda-optimization -- load-bearing test/deps.json >/dev/null
        cabal run -v0 agda-explore -- query search query=eval --graph test/deps.json >/dev/null
        cabal run -v0 agda-explore -- query brief name=Test.eval --graph test/deps.json >/dev/null
        echo "quickstart OK"

    - name: CLI help goldens (flag-surface drift guard)
      # Diffs each binary's --help against test/help/*.txt (version + build
      # fingerprint normalized). Any flag change must be accompanied by a
      # golden update (just help-goldens) — the safety net for CLI refactors.
      run: bash scripts/help-golden.sh check

    - name: agda-explore doctor (environment preflight)
      # Preloaded-fixture preflight passes (exit 0); a missing graph fails
      # (exit 1) with the actionable hint. The live checks (agda-deps / agda)
      # run in the optional ci-live workflow.
      run: |
        cabal run -v0 agda-explore -- doctor --graph test/deps.json >/dev/null
        echo "doctor (fixture) exit 0 OK"
        if cabal run -v0 agda-explore -- doctor --graph /nonexistent.json >/tmp/doctor.out 2>&1; then
          echo "doctor should have failed on a missing graph"; cat /tmp/doctor.out; exit 1
        fi
        grep -q "pass --graph FILE" /tmp/doctor.out \
          || { echo "doctor missing-graph hint absent"; cat /tmp/doctor.out; exit 1; }
        echo "doctor (missing graph) exit 1 + hint OK"

    - name: zero-config bootstrap (offline acceptance)
      # Writes every tool's config for a throwaway project, asserts they all
      # resolve to ONE graph, that a re-run is byte-identical, that
      # agda-optimization then runs with no graph path, and that a hand-repointed
      # config is caught (exit 1). No agda / agda-deps needed — their absence is
      # a warning here, which this run also proves.
      run: bash scripts/zero-config-smoke.sh

    - name: Config surface (offline acceptance)
      # Two contracts users read as "my config is ignored" when they break:
      # `--config FILE` / `--config=FILE` honoured in EVERY argv position (the
      # positional scanner reserves the post-subcommand slot for the graph
      # path), and an unknown key rejected rather than silently dropped — per
      # tool, since each has its own key vocabulary.
      run: bash scripts/config-smoke.sh

    - name: Shell completion script (agda-optimization)
      # Generated from the FlagSpec table: must be syntactically valid bash and
      # mention every subcommand (so completion can't drift from the parser).
      run: |
        cabal run -v0 agda-optimization -- --completion-script=bash > /tmp/comp.bash
        bash -n /tmp/comp.bash
        for s in motif load-bearing concept-bundle hint-bench; do
          grep -q "$s)" /tmp/comp.bash || { echo "completion missing subcommand: $s"; exit 1; }
        done
        echo "completion script OK"

    - name: interaction bridge — offline test-suite (protocol fixtures + pure logic)
      # Replays the committed golden --interaction-json transcripts under
      # test/interaction/<version>/ through the parser + burst-splitter, and
      # exercises the guard / literate / goal-id / edit logic. NO agda binary
      # is used — an Agda bump that changes the wire shape fails here until
      # the fixtures are regenerated (bash test/interaction/regen.sh).
      run: cabal test interaction-spec

    - name: agda-explore — interaction tools listed under --enable-interact
      run: |
        printf '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}\n' \
          | cabal run -v0 agda-explore -- --enable-interact --graph test/deps.json \
          | grep -q '"name":"construct"' \
          && echo "interaction tools present" \
          || { echo "interaction tools MISSING from tools/list"; exit 1; }
